<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAIP — 05 · Soumettre à l'analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes caipRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes caipFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes caipGauge{from{stroke-dasharray:0 327}}
@keyframes caipDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes caipFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1.5deg)}}
@keyframes caipPulse{0%{box-shadow:0 0 0 0 rgba(56,198,255,.6)}70%{box-shadow:0 0 0 12px rgba(56,198,255,0)}100%{box-shadow:0 0 0 0 rgba(56,198,255,0)}}
.caip-rise{animation:caipRise .6s cubic-bezier(.2,.7,.2,1) both}
.caip-fill{transform-origin:left center;animation:caipFill 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
.caip-gauge{animation:caipGauge 1.4s cubic-bezier(.2,.7,.2,1) .25s both}
.caip-swoosh{animation:caipFloat 8s ease-in-out infinite}
.caip-swoosh path{stroke-dasharray:600;animation:caipDraw 1.8s cubic-bezier(.2,.7,.2,1) .2s both}
.caip-btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.caip-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(26,75,255,.45)!important;filter:brightness(1.07)}
.caip-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.caip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,21,80,.10);border-color:#B9C7FF!important}
.caip-pulse{animation:caipPulse 2.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.caip-rise,.caip-fill,.caip-gauge,.caip-swoosh,.caip-swoosh path,.caip-pulse{animation:none!important}.caip-btn,.caip-card{transition:none}}

a{color:#1A4BFF}a:hover{color:#071C7A}
</style>
</head>
<body>


<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F3F6FE; font-family: Inter, system-ui, sans-serif; color: #0A1550; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px; background: #FFFFFF; border-bottom: 1px solid #E1E6F2">
    <a href="Tableau-de-bord.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1550" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700">Analyser ma candidature</h1>
  </header>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 22px">

    <section class="caip-rise" style="animation-delay: 0ms; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">1. Votre CV</h2>
        <span style="font-size: 12px; color: #4A5578">PDF ou DOCX · 5 Mo max.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #FFFFFF; border: 1.5px solid #0E7A4F; border-radius: 14px">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #E6F4EE; display: flex; align-items: center; justify-content: center; flex: 0 0 40px">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
        </span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <strong style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">CV_Amina_Hassan.pdf</strong>
          <span style="font-size: 12px; color: #0E7A4F; font-weight: 600">412 Ko · prêt</span>
        </div>
        <button aria-label="Retirer le fichier" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5578" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </section>

    <section class="caip-rise" style="animation-delay: 70ms; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">2. Votre lettre <span style="font-weight: 500; color: #4A5578; font-size: 14px">(facultatif)</span></h2>
      </div>
      
      
        <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px; background: #FFFFFF; border: 2px dashed #C9D2EC; border-radius: 14px; cursor: pointer; font-family: Inter, sans-serif; color: #0A1550">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1A4BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
          <strong style="font-size: 15px; color: #1A4BFF">Ajouter ma lettre</strong>
          <span style="font-size: 12px; color: #4A5578">PDF ou DOCX · 5 Mo max.</span>
        </button>
      
    </section>

    <section class="caip-rise" style="animation-delay: 140ms; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">3. Poste visé
        <input type="text" value="Assistante comptable" style="height: 48px; padding: 0px 14px; border: 1.5px solid rgb(201, 210, 236); border-radius: 12px; background: rgb(255, 255, 255); font: 400 16px Inter, sans-serif; color: rgb(10, 21, 80);">
      </label>
      <span style="font-size: 13px; color: #4A5578">Les recommandations seront adaptées à ce poste.</span>
    </section>

    <section class="caip-rise" style="animation-delay: 210ms; padding: 16px; background: #FFFFFF; border: 1px solid #E1E6F2; border-radius: 16px; display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5">
        <input type="checkbox" checked="" style="width: 20px; height: 20px; margin: 1px 0px 0px; accent-color: rgb(26, 75, 255); flex: 0 0 20px;">
        <span>J'accepte que mes documents soient analysés. Ils restent privés et ne servent jamais à entraîner une IA.</span>
      </label>
      <div style="height: 1px; background: #E1E6F2"></div>
      <label style="display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; line-height: 1.5">
        <span>Partager avec mon conseiller</span>
        <input type="checkbox" role="switch" style="width: 44px; height: 26px; accent-color: rgb(26, 75, 255); flex: 0 0 44px;">
      </label>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <a class="caip-btn" href="Rapport.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: linear-gradient(135deg, #2D5BFF 0%, #0A2FB8 100%); color: #FFFFFF; box-shadow: 0 6px 18px rgba(26,75,255,0.32); font-weight: 700; font-size: 16px; text-decoration: none">Lancer l'analyse</a>
      <span style="text-align: center; font-size: 13px; color: #4A5578">Votre rapport sera prêt en moins de 60 secondes.</span>
    </div>
  </div>
</div>

</body>
</html>
