<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAIP — 08 · Formation — quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes caipRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes caipFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes caipGauge{from{stroke-dasharray:0 327}}
@keyframes caipDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes caipFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1.5deg)}}
@keyframes caipPulse{0%{box-shadow:0 0 0 0 rgba(56,198,255,.6)}70%{box-shadow:0 0 0 12px rgba(56,198,255,0)}100%{box-shadow:0 0 0 0 rgba(56,198,255,0)}}
.caip-rise{animation:caipRise .6s cubic-bezier(.2,.7,.2,1) both}
.caip-fill{transform-origin:left center;animation:caipFill 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
.caip-gauge{animation:caipGauge 1.4s cubic-bezier(.2,.7,.2,1) .25s both}
.caip-swoosh{animation:caipFloat 8s ease-in-out infinite}
.caip-swoosh path{stroke-dasharray:600;animation:caipDraw 1.8s cubic-bezier(.2,.7,.2,1) .2s both}
.caip-btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.caip-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(26,75,255,.45)!important;filter:brightness(1.07)}
.caip-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.caip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,21,80,.10);border-color:#B9C7FF!important}
.caip-pulse{animation:caipPulse 2.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.caip-rise,.caip-fill,.caip-gauge,.caip-swoosh,.caip-swoosh path,.caip-pulse{animation:none!important}.caip-btn,.caip-card{transition:none}}

a{color:#1A4BFF}a:hover{color:#071C7A}
</style>
</head>
<body>


<div style="position: relative; width: 390px; height: 980px; box-sizing: border-box; background: #F3F6FE; font-family: Inter, system-ui, sans-serif; color: #0A1550; display: flex; flex-direction: column; padding-bottom: 84px; overflow: hidden">

  <header style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #1A4BFF">MODULE 3 SUR 6</span>
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.25">Se présenter en entretien</h1>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; height: 8px; border-radius: 4px; background: #E1E6F2">
        <div class="caip-fill" style="width: 40%; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #1A4BFF, #38C6FF)"></div>
      </div>
      <span style="font-size: 13px; color: #4A5578; font-weight: 600">Question 2 / 5</span>
    </div>
  </header>

  <section class="caip-rise" style="animation-delay: 0ms; margin: 18px 16px 0; padding: 20px; background: #FFFFFF; border: 1px solid #E1E6F2; border-radius: 20px; display: flex; flex-direction: column; gap: 14px">
    <h2 id="q" style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.4">Combien de temps viser pour vous présenter au début d'un entretien ?</h2>
    <div role="radiogroup" aria-labelledby="q" style="display: flex; flex-direction: column; gap: 10px">
      
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 2px solid #C9D2EC; background: #FFFFFF; text-align: left; font: 500 15px Inter, sans-serif; color: #0A1550; cursor: pointer">
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C9D2EC; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: 0 0 22px">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: transparent"></span>
          </span>30 secondes</button>
      
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 2px solid #C9D2EC; background: #FFFFFF; text-align: left; font: 500 15px Inter, sans-serif; color: #0A1550; cursor: pointer">
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C9D2EC; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: 0 0 22px">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: transparent"></span>
          </span>2 à 3 minutes</button>
      
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 2px solid #C9D2EC; background: #FFFFFF; text-align: left; font: 500 15px Inter, sans-serif; color: #0A1550; cursor: pointer">
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C9D2EC; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: 0 0 22px">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: transparent"></span>
          </span>10 minutes</button>
      
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 2px solid #C9D2EC; background: #FFFFFF; text-align: left; font: 500 15px Inter, sans-serif; color: #0A1550; cursor: pointer">
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C9D2EC; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: 0 0 22px">
            <span style="width: 10px; height: 10px; border-radius: 50%; background: transparent"></span>
          </span>Autant que nécessaire</button>
      
    </div>

    
    

    <button style="height: 52px; border: 0; border-radius: 14px; background: #E1E6F2; color: #4A5578; font: 700 16px Inter, sans-serif; cursor: pointer">Valider</button>
  </section>

  <section class="caip-rise" style="animation-delay: 70ms; margin: 16px 16px 0; padding: 16px 18px; background: #FFFFFF; border: 1px solid #E1E6F2; border-radius: 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Ma formation</h2>
      <span style="font-size: 13px; color: #4A5578">2 modules validés sur 6</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <span style="height: 8px; border-radius: 4px; background: #0E7A4F"></span>
      <span style="height: 8px; border-radius: 4px; background: #0E7A4F"></span>
      <span style="height: 8px; border-radius: 4px; background: #1A4BFF"></span>
      <span style="height: 8px; border-radius: 4px; background: #E1E6F2"></span>
      <span style="height: 8px; border-radius: 4px; background: #E1E6F2"></span>
      <span style="height: 8px; border-radius: 4px; background: #E1E6F2"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A5578">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>
      Votre attestation de suivi sera disponible après le module 6.
    </div>
  </section>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E1E6F2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Tableau-de-bord.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>Accueil</a>
    <a href="Modeles.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>Modèles</a>
    <a href="Depot.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M6 16v-5M11 16V8M16 16v-3M21 16V5"></path></svg>Analyse</a>
    <a href="Formation.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1A4BFF; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5z"></path><path d="M6 10v5c3 3 9 3 12 0v-5"></path></svg>Formation</a>
    <a href="Accompagnement.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path></svg>Conseiller</a>
  </nav>
</div>

</body>
</html>
