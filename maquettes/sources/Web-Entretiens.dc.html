<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CAIP — Préparer l'entretien (ordinateur)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes caipRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes caipFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes caipGauge{from{stroke-dasharray:0 327}}
@keyframes caipDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes caipFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1.5deg)}}
@keyframes caipPulse{0%{box-shadow:0 0 0 0 rgba(56,198,255,.6)}70%{box-shadow:0 0 0 12px rgba(56,198,255,0)}100%{box-shadow:0 0 0 0 rgba(56,198,255,0)}}
.caip-rise{animation:caipRise .6s cubic-bezier(.2,.7,.2,1) both}
.caip-fill{transform-origin:left center;animation:caipFill 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
.caip-gauge{animation:caipGauge 1.4s cubic-bezier(.2,.7,.2,1) .25s both}
.caip-swoosh{animation:caipFloat 8s ease-in-out infinite}
.caip-swoosh path{stroke-dasharray:600;animation:caipDraw 1.8s cubic-bezier(.2,.7,.2,1) .2s both}
.caip-btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.caip-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(26,75,255,.45)!important;filter:brightness(1.07)}
.caip-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.caip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,21,80,.10);border-color:#B9C7FF!important}
.caip-pulse{animation:caipPulse 2.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.caip-rise,.caip-fill,.caip-gauge,.caip-swoosh,.caip-swoosh path,.caip-pulse{animation:none!important}.caip-btn,.caip-card{transition:none}}

</style>
</helmet>
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; background: #F3F6FE; font-family: Inter, system-ui, sans-serif; color: #0A1550; display: flex; flex-wrap: wrap; align-items: stretch; align-content: flex-start">

  <aside style="flex: 1 1 232px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E1E6F2; border-bottom: 1px solid #E1E6F2; padding: 18px 16px; display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: 14px 12px">
    <div style="flex: 1 1 180px; display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <img src="/_blob/16085a41ab4cb964a98497d82995c93f" alt="Logo CAIP" style="width: 36px; height: 36px; border-radius: 10px">
      <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #071C7A">CAIP</span>
    </div>
    <a href="Web-Profil.dc.html" style="flex: 0 1 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; background: #F3F6FE; text-decoration: none; color: #0A1550">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #1A4BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: 0 0 36px">AH</span>
      <span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 14px">Amina Hassan</strong><span style="font-size: 12px; color: #1A4BFF">Profil et données</span></span>
    </a>
    <nav aria-label="Navigation principale" style="flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 4px">
      <a href="Web-Tableau-de-bord.dc.html" style="flex: 1 1 116px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #2A3566; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Accueil</a><a href="Web-Modeles.dc.html" style="flex: 1 1 116px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #2A3566; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Modèles</a><a href="Web-Rapport.dc.html" style="flex: 1 1 116px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #2A3566; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 16v-5M11 16V8M16 16v-3M21 16V5"/></svg>Analyses</a><a href="Web-Entretiens.dc.html" aria-current="page" style="flex: 1 1 116px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #E9EEFF; color: #1A4BFF; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Entretiens</a><a href="Web-Formation.dc.html" style="flex: 1 1 116px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #2A3566; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10v5c3 3 9 3 12 0v-5"/></svg>Formation</a><a href="Web-Accompagnement.dc.html" style="flex: 1 1 116px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #2A3566; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/></svg>Conseiller</a>
    </nav>
  </aside>
  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 32px">
    <div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 30px; font-weight: 800">Préparer l'entretien</h1><span style="font-size: 15px; color: #4A5578">Questions fréquentes et conseils, classés par thème.</span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <nav aria-label="Thèmes" style="flex: 1 1 240px; min-width: 0; padding: 10px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E1E6F2; display: flex; flex-direction: column; gap: 4px">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="5">
            <button onClick="{{ t.pick }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 0 14px; border: 0; border-radius: 12px; background: {{ t.bg }}; color: {{ t.fg }}; font: 600 14px Inter, sans-serif; text-align: left; cursor: pointer">{{ t.label }}<span style="font-size: 12px; font-weight: 600; color: #4A5578">{{ t.count }}</span></button>
          </sc-for>
        </nav>
        <section class="caip-rise" style="animation-delay: 0ms; flex: 3 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <div style="padding: 22px 24px; border-radius: 20px; background: radial-gradient(120% 90% at 100% 0%, rgba(56,198,255,0.32) 0%, rgba(56,198,255,0) 50%), linear-gradient(140deg, #0A2FB8 0%, #071C7A 50%, #05103F 100%); position: relative; overflow: hidden; isolation: isolate; color: #FFFFFF; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
            <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
              <strong style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px">{{ themeTitle }}</strong>
              <span style="font-size: 14px; color: #D6DDF5">{{ themeIntro }}</span>
            </div>
            <a class="caip-btn" href="Web-Formation.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; background: #38C6FF; color: #05103F; box-shadow: 0 8px 24px rgba(56,198,255,0.38); font-weight: 700; font-size: 14px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#071C7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>Module de formation</a>
          </div>
          <sc-for list="{{ questions }}" as="q" hint-placeholder-count="4">
            <article style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E1E6F2; overflow: hidden">
              <button onClick="{{ q.toggle }}" aria-expanded="{{ q.expanded }}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 14px 20px; border: 0; background: transparent; font: 600 15px Inter, sans-serif; color: #0A1550; text-align: left; cursor: pointer">{{ q.q }}<span style="font-size: 20px; color: #1A4BFF; flex: 0 0 auto">{{ q.sign }}</span></button>
              <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
                <div style="padding: 0 20px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.6; color: #2A3566">
                  <span><strong style="color: #0A1550">Ce que le recruteur cherche :</strong> {{ q.why }}</span>
                  <span><strong style="color: #0A1550">Conseil :</strong> {{ q.tip }}</span>
                </div>
              </sc-if>
            </article>
          </sc-for>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var theme = st.theme || 'freq';
    var open = st.open === undefined ? 0 : st.open;
    var data = {
      freq: { label: 'Questions fréquentes', intro: 'Les questions posées dans presque tous les entretiens.', qs: [
        { q: 'Parlez-moi de vous.', why: 'Votre capacité à résumer votre parcours en lien avec le poste.', tip: 'Deux à trois minutes : formation, expérience clé, ce qui vous amène ici.' },
        { q: 'Pourquoi ce poste vous intéresse-t-il ?', why: 'Votre motivation et ce que vous savez de l\u2019entreprise.', tip: 'Citez un élément précis de l\u2019offre ou de l\u2019entreprise.' },
        { q: 'Quelles sont vos qualités et vos défauts ?', why: 'Votre lucidité sur vous-même.', tip: 'Pour un défaut, montrez ce que vous faites pour progresser.' },
        { q: 'Où vous voyez-vous dans cinq ans ?', why: 'Si votre projet est cohérent avec le poste.', tip: 'Restez réaliste et liez votre réponse au poste proposé.' }
      ] },
      parcours: { label: 'Présenter son parcours', intro: 'Raconter son parcours de façon claire et convaincante.', qs: [
        { q: 'Comment expliquer un trou dans mon CV ?', why: 'Votre honnêteté et ce que vous avez fait de cette période.', tip: 'Restez bref et montrez ce que vous avez appris.' },
        { q: 'Comment valoriser un premier emploi ?', why: 'Vos stages, projets et engagements.', tip: 'Appuyez-vous sur des exemples concrets et chiffrés.' }
      ] },
      comportement: { label: 'Comportement', intro: 'Attitude, tenue et communication non verbale.', qs: [
        { q: 'Comment gérer le stress le jour J ?', why: 'Votre capacité à rester posé.', tip: 'Arrivez 10 minutes en avance et préparez trois exemples.' },
        { q: 'Que faire si je ne connais pas la réponse ?', why: 'Votre honnêteté et votre réflexion.', tip: 'Dites-le simplement et expliquez comment vous chercheriez.' }
      ] },
      questions: { label: 'Questions à poser', intro: 'Montrer son intérêt en fin d\u2019entretien.', qs: [
        { q: 'Quelles questions poser au recruteur ?', why: 'Votre intérêt réel pour le poste.', tip: 'Demandez à quoi ressemble une journée type ou les objectifs des premiers mois.' }
      ] },
      erreurs: { label: 'Erreurs courantes', intro: 'Ce qu\u2019il vaut mieux éviter.', qs: [
        { q: 'Les erreurs les plus fréquentes', why: 'Votre préparation.', tip: 'Ne pas connaître l\u2019entreprise, critiquer un ancien employeur, arriver en retard.' }
      ] }
    };
    var order = ['freq', 'parcours', 'comportement', 'questions', 'erreurs'];
    var themes = order.map(function (k) {
      var on = k === theme;
      return { label: data[k].label, count: data[k].qs.length, bg: on ? '#E9EEFF' : 'transparent', fg: on ? '#1A4BFF' : '#0A1550', pick: function () { self.setState({ theme: k, open: 0 }); } };
    });
    var questions = data[theme].qs.map(function (q, i) {
      var isOpen = open === i;
      return { q: q.q, why: q.why, tip: q.tip, open: isOpen, expanded: isOpen ? 'true' : 'false', sign: isOpen ? '−' : '+', toggle: function () { self.setState({ open: isOpen ? -1 : i }); } };
    });
    return { themes: themes, questions: questions, themeTitle: data[theme].label, themeIntro: data[theme].intro };
  }
}
</script>
</body>
</html>
