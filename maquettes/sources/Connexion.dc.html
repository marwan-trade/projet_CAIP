<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CAIP — Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes caipRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes caipFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes caipGauge{from{stroke-dasharray:0 327}}
@keyframes caipDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes caipFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1.5deg)}}
@keyframes caipPulse{0%{box-shadow:0 0 0 0 rgba(56,198,255,.6)}70%{box-shadow:0 0 0 12px rgba(56,198,255,0)}100%{box-shadow:0 0 0 0 rgba(56,198,255,0)}}
.caip-rise{animation:caipRise .6s cubic-bezier(.2,.7,.2,1) both}
.caip-fill{transform-origin:left center;animation:caipFill 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
.caip-gauge{animation:caipGauge 1.4s cubic-bezier(.2,.7,.2,1) .25s both}
.caip-swoosh{animation:caipFloat 8s ease-in-out infinite}
.caip-swoosh path{stroke-dasharray:600;animation:caipDraw 1.8s cubic-bezier(.2,.7,.2,1) .2s both}
.caip-btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.caip-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(26,75,255,.45)!important;filter:brightness(1.07)}
.caip-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.caip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,21,80,.10);border-color:#B9C7FF!important}
.caip-pulse{animation:caipPulse 2.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.caip-rise,.caip-fill,.caip-gauge,.caip-swoosh,.caip-swoosh path,.caip-pulse{animation:none!important}.caip-btn,.caip-card{transition:none}}

a{color:#1A4BFF}a:hover{color:#071C7A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6FE; font-family: Inter, system-ui, sans-serif; color: #0A1550; display: flex; flex-direction: column">

  <div style="background: radial-gradient(120% 90% at 100% 0%, rgba(56,198,255,0.32) 0%, rgba(56,198,255,0) 50%), linear-gradient(140deg, #0A2FB8 0%, #071C7A 50%, #05103F 100%); position: relative; overflow: hidden; isolation: isolate; padding: 28px 24px 56px; display: flex; flex-direction: column; align-items: center; gap: 12px"><svg class="caip-swoosh" aria-hidden="true" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" style="position: absolute; right: -40px; top: -10px; width: 72%; max-width: 680px; height: 115%; z-index: -1; pointer-events: none"><defs><linearGradient id="caipSw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#8ADCFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/></linearGradient></defs><path d="M30 370 C 170 260, 360 120, 585 55" stroke="url(#caipSw)" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M130 395 C 270 305, 430 225, 595 195" stroke="url(#caipSw)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
    <a href="Main.dc.html" aria-label="Retour à l'accueil" style="align-self: flex-start; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.08)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <img src="/_blob/16085a41ab4cb964a98497d82995c93f" alt="Logo CAIP" style="width: 72px; height: 72px; border-radius: 20px">
    <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #FFFFFF; letter-spacing: 0.5px">CAIP</span>
  </div>

  <div style="margin: -32px 16px 0; padding: 22px 20px 24px; background: #FFFFFF; border-radius: 22px; border: 1px solid #E1E6F2; display: flex; flex-direction: column; gap: 18px">
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9EEFF; border-radius: 14px">
      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
        <button role="tab" aria-selected="true" onClick="{{ showLogin }}" style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #1A4BFF; font: 600 14px Inter, sans-serif; box-shadow: 0 1px 3px rgba(10,21,80,0.12); cursor: pointer">Connexion</button>
        <button role="tab" aria-selected="false" onClick="{{ showSignup }}" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #4A5578; font: 600 14px Inter, sans-serif; cursor: pointer">Créer un compte</button>
      </sc-if>
      <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
        <button role="tab" aria-selected="false" onClick="{{ showLogin }}" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #4A5578; font: 600 14px Inter, sans-serif; cursor: pointer">Connexion</button>
        <button role="tab" aria-selected="true" onClick="{{ showSignup }}" style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #1A4BFF; font: 600 14px Inter, sans-serif; box-shadow: 0 1px 3px rgba(10,21,80,0.12); cursor: pointer">Créer un compte</button>
      </sc-if>
    </div>

    <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nom complet
        <input type="text" placeholder="Ex. Amina Hassan" style="height: 48px; padding: 0 14px; border: 1.5px solid #C9D2EC; border-radius: 12px; font: 400 16px Inter, sans-serif; color: #0A1550">
      </label>
    </sc-if>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Adresse e-mail
      <input type="email" placeholder="vous@exemple.com" style="height: 48px; padding: 0 14px; border: 1.5px solid #C9D2EC; border-radius: 12px; font: 400 16px Inter, sans-serif; color: #0A1550">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Mot de passe
      <input type="password" placeholder="••••••••" style="height: 48px; padding: 0 14px; border: 1.5px solid #C9D2EC; border-radius: 12px; font: 400 16px Inter, sans-serif; color: #0A1550">
    </label>

    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <a href="#" style="align-self: flex-end; font-size: 14px; font-weight: 600; text-decoration: none; padding: 4px 0">Mot de passe oublié ?</a>
    </sc-if>

    <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #4A5578">
        <input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #1A4BFF; flex: 0 0 20px">
        <span>J'accepte la <a href="#">politique de confidentialité</a>. Mes documents ne seront jamais utilisés pour entraîner une IA.</span>
      </label>
    </sc-if>

    <a class="caip-btn" href="Tableau-de-bord.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #2D5BFF 0%, #0A2FB8 100%); color: #FFFFFF; box-shadow: 0 6px 18px rgba(26,75,255,0.32); font-weight: 700; font-size: 16px; text-decoration: none">{{ cta }}</a>
  </div>

  <p style="margin: auto 24px 28px; text-align: center; font-size: 13px; line-height: 1.5; color: #4A5578">Connexion sécurisée. Après plusieurs essais incorrects, la connexion est bloquée quelques minutes.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOnSignup":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var signup = this.state && this.state.signup !== undefined ? this.state.signup : (this.props.startOnSignup ?? false);
    return {
      isSignup: signup,
      isLogin: !signup,
      cta: signup ? 'Créer mon compte' : 'Se connecter',
      showLogin: () => this.setState({ signup: false }),
      showSignup: () => this.setState({ signup: true })
    };
  }
}
</script>
</body>
</html>
