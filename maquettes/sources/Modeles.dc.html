<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CAIP — Bibliothèque de modèles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes caipRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes caipFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes caipGauge{from{stroke-dasharray:0 327}}
@keyframes caipDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes caipFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1.5deg)}}
@keyframes caipPulse{0%{box-shadow:0 0 0 0 rgba(56,198,255,.6)}70%{box-shadow:0 0 0 12px rgba(56,198,255,0)}100%{box-shadow:0 0 0 0 rgba(56,198,255,0)}}
.caip-rise{animation:caipRise .6s cubic-bezier(.2,.7,.2,1) both}
.caip-fill{transform-origin:left center;animation:caipFill 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
.caip-gauge{animation:caipGauge 1.4s cubic-bezier(.2,.7,.2,1) .25s both}
.caip-swoosh{animation:caipFloat 8s ease-in-out infinite}
.caip-swoosh path{stroke-dasharray:600;animation:caipDraw 1.8s cubic-bezier(.2,.7,.2,1) .2s both}
.caip-btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.caip-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(26,75,255,.45)!important;filter:brightness(1.07)}
.caip-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.caip-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(10,21,80,.10);border-color:#B9C7FF!important}
.caip-pulse{animation:caipPulse 2.2s ease-out infinite}
@media (prefers-reduced-motion: reduce){.caip-rise,.caip-fill,.caip-gauge,.caip-swoosh,.caip-swoosh path,.caip-pulse{animation:none!important}.caip-btn,.caip-card{transition:none}}

a{color:#1A4BFF}a:hover{color:#071C7A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1060px; box-sizing: border-box; background: #F3F6FE; font-family: Inter, system-ui, sans-serif; color: #0A1550; display: flex; flex-direction: column; padding-bottom: 84px; overflow: hidden">

  <header style="padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 800">Modèles</h1>
    <label style="position: relative; display: block">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un modèle</span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5578" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" placeholder="Rechercher : comptable, stage, vente…" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px 0 42px; border: 1.5px solid #C9D2EC; border-radius: 12px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #0A1550">
    </label>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E4E9FB; border-radius: 14px">
      <sc-for list="{{ types }}" as="t" hint-placeholder-count="2">
        <button role="tab" onClick="{{ t.pick }}" style="height: 44px; border: 0; border-radius: 10px; background: {{ t.bg }}; color: {{ t.fg }}; font: 600 14px Inter, sans-serif; cursor: pointer">{{ t.label }}</button>
      </sc-for>
    </div>
  </header>

  <div style="display: flex; gap: 8px; overflow-x: auto; padding: 8px 20px 12px">
    <sc-for list="{{ sectors }}" as="s" hint-placeholder-count="6">
      <button onClick="{{ s.pick }}" style="flex: 0 0 auto; height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{ s.border }}; background: {{ s.bg }}; color: {{ s.fg }}; font: 600 13px Inter, sans-serif; cursor: pointer; white-space: nowrap">{{ s.label }}</button>
    </sc-for>
  </div>

  <a href="#" style="margin: 0 16px 14px; padding: 14px 16px; border-radius: 16px; background: #E9EEFF; display: flex; align-items: center; gap: 12px; color: #0A1550; text-decoration: none">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A4BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4"/><path d="M12 17h.01"/></svg>
    <span style="flex: 1; font-size: 14px; line-height: 1.4"><strong>Pas sûr de quoi écrire ?</strong> Suivez le guide pas à pas, avec un exemple à chaque étape.</span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A4BFF" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <div style="padding: 0 16px; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 14px; color: #4A5578">{{ countLabel }}</span>
  </div>

  <div style="padding: 10px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{ items }}" as="m" hint-placeholder-count="4">
      <div class="caip-card" style="background: #FFFFFF; border: 1px solid #E1E6F2; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px">
        <div style="height: 150px; border-radius: 10px; background: #F3F6FE; border: 1px solid #E1E6F2; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px">
          <div style="height: 9px; width: 65%; background: {{ m.color }}; border-radius: 3px"></div>
          <div style="height: 5px; width: 40%; background: #C9D2EC; border-radius: 3px"></div>
          <div style="height: 1px; background: #E1E6F2; margin: 5px 0"></div>
          <div style="height: 5px; width: 90%; background: #DCE2F0; border-radius: 3px"></div>
          <div style="height: 5px; width: 80%; background: #DCE2F0; border-radius: 3px"></div>
          <div style="height: 5px; width: 86%; background: #DCE2F0; border-radius: 3px"></div>
          <div style="height: 7px; width: 38%; background: {{ m.color }}; opacity: 0.6; border-radius: 3px; margin-top: 5px"></div>
          <div style="height: 5px; width: 90%; background: #DCE2F0; border-radius: 3px"></div>
          <div style="height: 5px; width: 70%; background: #DCE2F0; border-radius: 3px"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 2px">
          <strong style="font-size: 14px">{{ m.name }}</strong>
          <span style="font-size: 12px; color: #4A5578">{{ m.sector }} · DOCX, PDF</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
          <button style="height: 40px; border-radius: 10px; border: 1.5px solid #C9D2EC; background: #FFFFFF; color: #0A1550; font: 600 13px Inter, sans-serif; cursor: pointer">Aperçu</button>
          <button class="caip-btn" style="height: 40px; border-radius: 10px; border: 0; background: linear-gradient(135deg, #2D5BFF 0%, #0A2FB8 100%); color: #FFFFFF; box-shadow: 0 6px 18px rgba(26,75,255,0.32); font: 600 13px Inter, sans-serif; cursor: pointer">Utiliser</button>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E1E6F2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Tableau-de-bord.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Accueil</a>
    <a href="Modeles.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1A4BFF; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Modèles</a>
    <a href="Depot.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 16v-5M11 16V8M16 16v-3M21 16V5"/></svg>Analyse</a>
    <a href="Formation.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10v5c3 3 9 3 12 0v-5"/></svg>Formation</a>
    <a href="Accompagnement.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4A5578; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/></svg>Conseiller</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.state || {};
    var type = st.type || 'cv';
    var sector = st.sector || 'Tous';
    var all = [
      { kind: 'cv', name: 'CV Classique', sector: 'Administration', color: '#1A4BFF' },
      { kind: 'cv', name: 'CV Moderne', sector: 'Commerce', color: '#071C7A' },
      { kind: 'cv', name: 'CV Premier emploi', sector: 'Tous secteurs', color: '#0E7A4F' },
      { kind: 'cv', name: 'CV Reconversion', sector: 'Tous secteurs', color: '#B45309' },
      { kind: 'cv', name: 'CV Technique', sector: 'Informatique', color: '#1A4BFF' },
      { kind: 'cv', name: 'CV Santé', sector: 'Santé', color: '#0E7A4F' },
      { kind: 'lettre', name: 'Réponse à une offre', sector: 'Tous secteurs', color: '#1A4BFF' },
      { kind: 'lettre', name: 'Candidature spontanée', sector: 'Commerce', color: '#071C7A' },
      { kind: 'lettre', name: 'Premier emploi', sector: 'Tous secteurs', color: '#0E7A4F' },
      { kind: 'lettre', name: 'Reconversion', sector: 'Tous secteurs', color: '#B45309' },
      { kind: 'lettre', name: 'Demande de stage', sector: 'Administration', color: '#1A4BFF' }
    ];
    var items = all.filter(function (m) {
      return m.kind === type && (sector === 'Tous' || m.sector === sector || m.sector === 'Tous secteurs');
    });
    var self = this;
    var types = [{ id: 'cv', label: 'CV' }, { id: 'lettre', label: 'Lettres de motivation' }].map(function (t) {
      var on = t.id === type;
      return { label: t.label, bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#1A4BFF' : '#4A5578', pick: function () { self.setState({ type: t.id }); } };
    });
    var sectors = ['Tous', 'Administration', 'Commerce', 'Santé', 'Informatique'].map(function (s) {
      var on = s === sector;
      return { label: s, bg: on ? '#1A4BFF' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0A1550', border: on ? '#1A4BFF' : '#C9D2EC', pick: function () { self.setState({ sector: s }); } };
    });
    return {
      types: types,
      sectors: sectors,
      items: items,
      countLabel: items.length + (items.length > 1 ? ' modèles' : ' modèle')
    };
  }
}
</script>
</body>
</html>
